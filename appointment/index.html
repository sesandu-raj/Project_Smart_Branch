<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Schedule Your Private Session | The Sovereign Path</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: "#faf8ff",
              "on-background": "#131b2e",
              primary: "#000000",
              "on-primary": "#ffffff",
              secondary: "#505f76",
              "on-tertiary-container": "#009668",
              "surface-container-low": "#f2f3ff",
              "surface-container-lowest": "#ffffff",
              "outline-variant": "#c6c6cd",
            },
            fontFamily: { headline: ["Manrope"], body: ["Inter"] },
          },
        },
      };
    </script>
  </head>
  <body class="bg-background text-on-background font-body antialiased">
    <header
      class="bg-slate-50/80 backdrop-blur-xl fixed top-0 w-full z-50 shadow-sm"
    >
      <div
        class="flex justify-between items-center px-8 py-4 max-w-screen-2xl mx-auto"
      >
        <div
          class="text-xl font-bold tracking-tighter text-slate-900 font-headline"
        >
          The Sovereign Path
        </div>
        <nav class="flex items-center space-x-8 font-semibold text-sm">
          <a
            class="text-emerald-600 border-b-2 border-emerald-600 pb-1 transition-all"
            href="../customerUI/index.html"
            >Home</a
          >
          <a
            class="text-slate-500 hover:text-black transition-all"
            href="../customerUI/services.html"
            >Services</a
          >
          <a
            class="text-slate-500 hover:text-black transition-all"
            href="../customerUI/branches.html"
            >Branches</a
          >
          <a
            class="text-slate-500 hover:text-black transition-all"
            href="../customerUI/rates.html"
            >Rates</a
          >
          <a
            class="text-slate-500 hover:text-black transition-all"
            href="../customerUI/profile.html"
            >My Profile</a
          >
        </nav>
      </div>
    </header>

    <main class="pt-32 pb-24 px-8 max-w-7xl mx-auto">
      <div class="mb-16">
        <h1
          class="font-headline font-extrabold text-5xl md:text-6xl tracking-tighter mb-4"
        >
          Schedule Your Session
        </h1>
        <p class="text-secondary text-lg max-w-2xl">
          Secure your time with a dedicated Sovereign Advisor.
        </p>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
        <div class="lg:col-span-2 space-y-12">
          <section>
            <h2 class="font-headline font-bold text-2xl mb-8">
              Selected Service
            </h2>
            <div
              class="p-6 rounded-xl bg-surface-container-lowest border-2 border-on-tertiary-container shadow-sm"
            >
              <span class="font-headline font-bold text-lg" id="display-service"
                >Loading...</span
              >
            </div>
          </section>

          <section>
            <h2 class="font-headline font-bold text-2xl mb-8">Location</h2>
            <label class="block text-sm font-semibold text-secondary mb-2"
              >Select Branch</label
            >
            <div class="relative">
              <select
                id="branch-select"
                class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant py-4 px-4 appearance-none focus:ring-0 focus:border-on-tertiary-container"
              >
                <option value="">Choose a branch...</option>
              </select>
            </div>
          </section>

          <section>
            <h2 class="font-headline font-bold text-2xl mb-8">
              Required Documents
            </h2>
            <div class="space-y-4" id="document-options">
              <label
                class="flex items-center gap-4 p-4 rounded-xl bg-surface-container-low cursor-pointer hover:bg-surface-container-high transition-colors"
              >
                <input
                  type="checkbox"
                  value="National ID"
                  class="doc-checkbox w-5 h-5 rounded text-on-tertiary-container"
                />
                <span class="font-medium">National ID</span>
              </label>
              <label
                class="flex items-center gap-4 p-4 rounded-xl bg-surface-container-low cursor-pointer hover:bg-surface-container-high transition-colors"
              >
                <input
                  type="checkbox"
                  value="Birth Certificate"
                  class="doc-checkbox w-5 h-5 rounded text-on-tertiary-container"
                />
                <span class="font-medium">Birth Certificate</span>
              </label>
              <label
                class="flex items-center gap-4 p-4 rounded-xl bg-surface-container-low cursor-pointer hover:bg-surface-container-high transition-colors"
              >
                <input
                  type="checkbox"
                  value="Wedding Certificate"
                  class="doc-checkbox w-5 h-5 rounded text-on-tertiary-container"
                />
                <span class="font-medium">Wedding Certificate</span>
              </label>
            </div>
          </section>

          <section>
            <h2 class="font-headline font-bold text-2xl mb-8">Availability</h2>
            <input
              type="datetime-local"
              id="time-slot"
              class="w-full p-4 rounded-xl border border-outline-variant bg-surface-container-low"
            />
          </section>
        </div>

        <div class="lg:col-span-1">
          <div
            class="sticky top-32 p-8 bg-white rounded-xl shadow-2xl border border-outline-variant/10"
          >
            <h3 class="font-headline font-bold text-xl mb-6">
              Booking Summary
            </h3>
            <button
              id="btn-book"
              class="w-full bg-primary text-on-primary py-5 rounded-xl font-extrabold text-lg hover:opacity-90 active:scale-95 transition-all"
            >
              Confirm Appointment
            </button>
          </div>
        </div>
      </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="appointment.js"></script>
  </body>
</html>
