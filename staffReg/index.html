<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Staff Registration | The Sovereign Path</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#000000",
              "tertiary-fixed-dim": "#4edea3",
              secondary: "#505f76",
              background: "#faf8ff",
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 300,
          "GRAD" 0,
          "opsz" 24;
      }
      .form-input-focus:focus {
        outline: none;
        border-bottom-color: #009668;
      }
    </style>
  </head>
  <body
    class="bg-background text-on-surface font-body antialiased min-h-screen flex items-center justify-center p-6 md:p-12"
  >
    <main class="w-full max-w-6xl">
      <div
        class="mb-12 flex flex-col md:flex-row justify-between items-start md:items-end gap-6"
      >
        <div>
          <span
            class="text-xs font-semibold tracking-[0.2em] text-emerald-600 uppercase mb-2 block"
            >Personnel Acquisition</span
          >
          <h1
            class="text-4xl md:text-5xl font-extrabold font-headline tracking-tighter"
          >
            New Staff Onboarding
          </h1>
        </div>
        <div class="pb-1">
          <a
            href="../StaffUI/index.html"
            class="text-xs font-bold uppercase tracking-widest text-secondary hover:text-black flex items-center gap-2"
          >
            <span class="material-symbols-outlined text-sm">arrow_back</span>
            Back to Login
          </a>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
        <div
          class="lg:col-span-8 bg-white p-8 md:p-10 rounded-xl shadow-sm border border-slate-100 relative overflow-hidden"
        >
          <form id="staff-form" class="space-y-10 relative z-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
              <div class="flex flex-col">
                <label
                  class="text-[10px] uppercase font-bold tracking-widest text-secondary mb-2"
                  >Staff ID (System Generated)</label
                >
                <input
                  id="staff-id-display"
                  class="bg-slate-50 border-b-2 border-slate-200 py-3 px-0 font-headline font-bold text-slate-400 cursor-not-allowed"
                  disabled
                  placeholder="S-XXXX"
                  type="text"
                />
              </div>
              <div class="flex flex-col">
                <label
                  class="text-[10px] uppercase font-bold tracking-widest text-secondary mb-2"
                  >Branch Code</label
                >
                <input
                  id="branch-code"
                  class="bg-transparent border-b-2 border-slate-200 py-3 px-0 font-medium form-input-focus transition-all"
                  placeholder="e.g., CMB-01"
                  type="text"
                  required
                />
              </div>
            </div>

            <div class="flex flex-col">
              <label
                class="text-[10px] uppercase font-bold tracking-widest text-secondary mb-2"
                >Full Legal Name</label
              >
              <input
                id="staff-name"
                class="bg-transparent border-b-2 border-slate-200 py-3 px-0 text-xl font-headline font-semibold form-input-focus transition-all"
                placeholder="Enter Full Name"
                type="text"
                required
              />
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
              <div class="flex flex-col">
                <label
                  class="text-[10px] uppercase font-bold tracking-widest text-secondary mb-2"
                  >ID Number (NIC)</label
                >
                <input
                  id="staff-nic"
                  class="bg-transparent border-b-2 border-slate-200 py-3 px-0 font-medium form-input-focus transition-all"
                  placeholder="19XXXXXXXXXX"
                  type="text"
                  required
                />
              </div>
              <div class="flex flex-col">
                <label
                  class="text-[10px] uppercase font-bold tracking-widest text-secondary mb-2"
                  >Birthday</label
                >
                <input
                  id="staff-bday"
                  class="bg-transparent border-b-2 border-slate-200 py-3 px-0 font-medium form-input-focus transition-all"
                  type="date"
                  required
                />
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
              <div class="flex flex-col">
                <label
                  class="text-[10px] uppercase font-bold tracking-widest text-secondary mb-2"
                  >Official Email Address</label
                >
                <input
                  id="staff-email"
                  class="bg-transparent border-b-2 border-slate-200 py-3 px-0 font-medium form-input-focus transition-all"
                  placeholder="staff@sovereignpath.com"
                  type="email"
                  required
                />
              </div>
              <div class="flex flex-col">
                <label
                  class="text-[10px] uppercase font-bold tracking-widest text-secondary mb-2"
                  >Phone Number</label
                >
                <input
                  id="staff-phone"
                  class="bg-transparent border-b-2 border-slate-200 py-3 px-0 font-medium form-input-focus transition-all"
                  placeholder="+94 7X XXX XXXX"
                  type="tel"
                  required
                />
              </div>
            </div>

            <div class="flex flex-col">
              <label
                class="text-[10px] uppercase font-bold tracking-widest text-secondary mb-2"
                >Access Password</label
              >
              <input
                id="staff-pass"
                class="bg-transparent border-b-2 border-slate-200 py-3 px-0 font-medium form-input-focus transition-all"
                placeholder="••••••••"
                type="password"
                required
              />
            </div>

            <div class="flex flex-col">
              <label
                class="text-[10px] uppercase font-bold tracking-widest text-secondary mb-2"
                >Permanent Residential Address</label
              >
              <textarea
                id="staff-address"
                class="bg-transparent border-b-2 border-slate-200 py-3 px-0 font-medium form-input-focus transition-all resize-none"
                placeholder="Street, City"
                rows="2"
                required
              ></textarea>
            </div>

            <div
              class="pt-10 flex flex-col sm:flex-row items-center justify-end gap-6"
            >
              <button
                id="btn-register"
                type="button"
                class="w-full sm:w-auto bg-primary text-white px-10 py-5 rounded-xl font-bold font-headline uppercase flex items-center justify-center gap-3 hover:bg-slate-800 transition-all shadow-lg"
              >
                Initialize Member Profile
                <span class="material-symbols-outlined text-sm"
                  >arrow_forward</span
                >
              </button>
            </div>
          </form>
        </div>

        <div class="lg:col-span-4 space-y-8">
          <div class="bg-slate-100 p-8 rounded-xl">
            <h3 class="font-headline font-bold text-lg mb-4">
              Registration Policy
            </h3>
            <p class="text-xs leading-relaxed text-secondary italic">
              Data is encrypted at rest using AES-256 standards as per wealth
              management compliance.
            </p>
          </div>
        </div>
      </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="staffRegister.js"></script>
  </body>
</html>
