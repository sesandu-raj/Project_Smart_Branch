<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Client Onboarding | The Sovereign Path</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#000000",
              background: "#faf8ff",
              "surface-container-lowest": "#ffffff",
              "tertiary-fixed-dim": "#4edea3",
              secondary: "#505f76",
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        vertical-align: middle;
      }
      .stepper-glow {
        box-shadow: 0 0 15px rgba(78, 222, 163, 0.4);
      }
    </style>
  </head>
  <body class="bg-background font-body text-on-surface antialiased">
    <main class="min-h-screen flex items-center justify-center p-6 md:p-12">
      <div
        class="max-w-5xl w-full flex flex-col lg:flex-row gap-12 items-center lg:items-start"
      >
        <div class="lg:w-1/3 pt-4 text-center lg:text-left">
          <p
            class="text-[10px] font-bold tracking-[0.2em] uppercase text-secondary mb-4"
          >
            Client Relations
          </p>
          <h2
            class="font-headline text-4xl md:text-5xl font-extrabold tracking-tighter leading-none mb-6"
          >
            User Onboarding
          </h2>
          <p class="text-secondary leading-relaxed mb-8">
            Begin your journey with The Sovereign Path. Create a secure profile
            to access personalized banking and concierge services.
          </p>
          <a
            href="../StaffUI/index.html"
            class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-primary hover:underline"
          >
            <span class="material-symbols-outlined text-base">arrow_back</span>
            Return to Login
          </a>
        </div>

        <div
          class="lg:w-2/3 w-full bg-surface-container-lowest rounded-[2rem] p-8 md:p-12 shadow-xl relative overflow-hidden border border-slate-100"
        >
          <form id="client-reg-form" class="relative z-10 space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-10">
              <div class="flex flex-col gap-2">
                <label
                  class="text-[10px] font-bold uppercase tracking-widest text-secondary"
                  >Legal Full Name</label
                >
                <input
                  id="reg-name"
                  class="bg-slate-50 border-0 border-b-2 border-slate-200 focus:border-tertiary-fixed-dim focus:ring-0 text-lg font-bold"
                  placeholder="Your Name"
                  type="text"
                  required
                />
              </div>
              <div class="flex flex-col gap-2">
                <label
                  class="text-[10px] font-bold uppercase tracking-widest text-secondary"
                  >Identification (NIC)</label
                >
                <input
                  id="reg-nic"
                  class="bg-slate-50 border-0 border-b-2 border-slate-200 focus:border-tertiary-fixed-dim focus:ring-0 text-lg font-bold"
                  placeholder="19XXXXXXXXXX"
                  type="text"
                  required
                />
              </div>
              <div class="flex flex-col gap-2">
                <label
                  class="text-[10px] font-bold uppercase tracking-widest text-secondary"
                  >Email Address</label
                >
                <input
                  id="reg-email"
                  class="bg-slate-50 border-0 border-b-2 border-slate-200 focus:border-tertiary-fixed-dim focus:ring-0 text-lg font-bold"
                  placeholder="name@example.com"
                  type="email"
                  required
                />
              </div>
              <div class="flex flex-col gap-2">
                <label
                  class="text-[10px] font-bold uppercase tracking-widest text-secondary"
                  >Secure Password</label
                >
                <input
                  id="reg-pass"
                  class="bg-slate-50 border-0 border-b-2 border-slate-200 focus:border-tertiary-fixed-dim focus:ring-0 text-lg font-bold"
                  placeholder="••••••••"
                  type="password"
                  required
                />
              </div>
              <div class="flex flex-col gap-2">
                <label
                  class="text-[10px] font-bold uppercase tracking-widest text-secondary"
                  >Date of Birth</label
                >
                <input
                  id="reg-bday"
                  class="bg-slate-50 border-0 border-b-2 border-slate-200 focus:border-tertiary-fixed-dim focus:ring-0 text-lg font-bold"
                  type="date"
                  required
                />
              </div>
              <div class="flex flex-col gap-2">
                <label
                  class="text-[10px] font-bold uppercase tracking-widest text-secondary"
                  >Residential Town</label
                >
                <input
                  id="reg-town"
                  class="bg-slate-50 border-0 border-b-2 border-slate-200 focus:border-tertiary-fixed-dim focus:ring-0 text-lg font-bold"
                  placeholder="e.g., Kurunegala"
                  type="text"
                  required
                />
              </div>
            </div>

            <div class="pt-10">
              <button
                id="btn-register"
                type="button"
                class="w-full md:w-auto px-12 py-5 bg-primary text-white rounded-xl font-bold hover:bg-slate-800 transition-all flex items-center justify-center gap-3 shadow-lg shadow-black/10"
              >
                Register Now
                <span class="material-symbols-outlined">how_to_reg</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="register.js"></script>
  </body>
</html>
