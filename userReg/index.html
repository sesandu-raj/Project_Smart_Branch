<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Branch - User Registration</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="login-card">
        <h1>User Registration</h1>
        <input type="text" id="reg-name" placeholder="Full Name" />
        <input type="text" id="reg-nic" placeholder="NIC Number" />
        <input type="email" id="reg-email" placeholder="Email Address" />
        <input type="password" id="reg-pass" placeholder="Create Password" />
        <input type="date" id="reg-bday" placeholder="Birthday" />
        <input type="text" id="reg-town" placeholder="Town" />
        <button id="btn-register">Register Now</button>
        <p>
          <a
            href="file:///Users/sesanduramath/Desktop/Project_Smart_Branch/customerUI/index.html"
            >Back to Login</a
          >
        </p>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="register.js"></script>
  </body>
</html>
